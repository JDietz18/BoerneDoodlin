name: Tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run the suite
        run: node --test tests/*.test.mjs
      - name: Build the portable copy
        run: node scripts/build-portable.mjs build/portable
